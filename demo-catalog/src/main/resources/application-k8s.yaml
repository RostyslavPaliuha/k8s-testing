spring:
  cloud:
    consul:
      host: discovery-server.discovery-server-ns.svc.cluster.local
      port: 8500
      discovery:
        prefer-ip-address: true
        instance-id: ${POD_NAME}
        deregister: true
  application:
    name: catalog

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://local.ks.tv/authorization
          jwk-set-uri: http://authorization-server.authorization-server-ns.svc.cluster.local/authorization/oauth2/jwks
server:
  port: 8083
logging:
  level:
    web: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0


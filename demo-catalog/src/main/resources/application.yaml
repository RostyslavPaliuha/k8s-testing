spring:
  application:
    name: catalog

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/authorization
          jwk-set-uri: http://localhost:9000/authorization/oauth2/jwks
server:
  port: 8083
logging:
  level:
    web: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# LOCAL DEVELOPMENT ONLY — KMS emulator backing Vault's awskms seal.
#
# Lets the local cluster run the exact same `seal "awskms"` stanza as EKS, so
# auto-unseal is genuinely exercised instead of being stubbed out.
#
# LocalStack community has no persistence: every restart starts empty. That
# would normally destroy Vault, because a regenerated KMS key cannot decrypt
# Vault's stored root key. Two things make it survivable:
#
#   * the _custom_id_ tag pins the key ID across restarts
#   * Origin=EXTERNAL + ImportKeyMaterial pins the key *material*, which we
#     supply ourselves from the Secret below
#
# Verified end to end: ciphertext produced before the container was destroyed
# still decrypts after it is recreated from scratch.
apiVersion: v1
kind: Namespace
metadata:
  name: localstack-ns
  labels:
    name: localstack-ns
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-kms-key-material
  namespace: localstack-ns
type: Opaque
stringData:
  # Exactly 32 bytes — AES-256 key material for the emulated KMS key.
  #
  # This is a throwaway local value, not a credential: it only has meaning
  # against LocalStack on a developer laptop. Production seals with a real KMS
  # key whose material never leaves AWS. Do not copy this pattern to a shared
  # cluster.
  material.bin: "vault-local-unseal-key-32bytes!!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: localstack-ns
data:
  # LocalStack executes everything in /etc/localstack/init/ready.d once the
  # services are up, on every container start.
  01-vault-kms.sh: |
    #!/bin/bash
    set -e

    # awslocal defaults to us-east-1; the seal stanza asks for eu-central-1,
    # and a key created in the wrong region surfaces only as "Vault will not
    # unseal", with nothing useful in the logs.
    export AWS_DEFAULT_REGION=eu-central-1

    KEY_ID="11111111-2222-3333-4444-555555555555"
    MATERIAL=/etc/localstack/keymaterial/material.bin

    if awslocal kms describe-key --key-id "$KEY_ID" >/dev/null 2>&1; then
      echo "vault-kms: key already present, nothing to do"
      exit 0
    fi

    echo "vault-kms: creating key with pinned id ${KEY_ID}"
    awslocal kms create-key \
      --origin EXTERNAL \
      --tags TagKey=_custom_id_,TagValue="$KEY_ID" >/dev/null

    awslocal kms get-parameters-for-import \
      --key-id "$KEY_ID" \
      --wrapping-algorithm RSAES_OAEP_SHA_256 \
      --wrapping-key-spec RSA_2048 > /tmp/import-params.json

    python3 -c "
    import base64, json
    p = json.load(open('/tmp/import-params.json'))
    open('/tmp/wrapping_pub.der','wb').write(base64.b64decode(p['PublicKey']))
    open('/tmp/import_token.bin','wb').write(base64.b64decode(p['ImportToken']))
    "

    openssl pkeyutl -encrypt \
      -in "$MATERIAL" \
      -out /tmp/wrapped.bin \
      -inkey /tmp/wrapping_pub.der -keyform DER -pubin \
      -pkeyopt rsa_padding_mode:oaep \
      -pkeyopt rsa_oaep_md:sha256

    awslocal kms import-key-material \
      --key-id "$KEY_ID" \
      --encrypted-key-material fileb:///tmp/wrapped.bin \
      --import-token fileb:///tmp/import_token.bin \
      --expiration-model KEY_MATERIAL_DOES_NOT_EXPIRE >/dev/null

    awslocal kms create-alias \
      --alias-name alias/vault-unseal \
      --target-key-id "$KEY_ID" 2>/dev/null || true

    rm -f /tmp/wrapped.bin /tmp/wrapping_pub.der /tmp/import_token.bin /tmp/import-params.json
    echo "vault-kms: alias/vault-unseal ready"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack-ns
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: kms
            - name: AWS_DEFAULT_REGION
              value: eu-central-1
            - name: EAGER_SERVICE_LOADING
              value: "1"
          readinessProbe:
            # Deliberately probes the key, not the health endpoint. LocalStack
            # reports healthy before the init hook has imported the material,
            # and Vault starting in that window would fail to unseal.
            exec:
              command:
                - sh
                - -c
                - awslocal kms describe-key --key-id alias/vault-unseal >/dev/null 2>&1
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
            - name: keymaterial
              mountPath: /etc/localstack/keymaterial
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: localstack-init
            defaultMode: 0755
        - name: keymaterial
          secret:
            secretName: vault-kms-key-material
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack-ns
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      name: edge

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.14
    helm:
      values: |
        reloader:
          # Watch all namespaces; only workloads carrying a reloader
          # annotation are actually restarted.
          watchGlobally: true
          # Bump a pod-template annotation rather than injecting env vars.
          reloadStrategy: annotations
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-observability-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  spring-boot-k8s.json: |
    {
      "title": "Spring Boot Observability - Kubernetes",
      "uid": "spring-boot-k8s",
      "tags": ["spring-boot", "java", "kubernetes"],
      "refresh": "30s",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "label": "Service",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(jvm_memory_used_bytes, service)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*"
          },
          {
            "name": "instance",
            "type": "query",
            "label": "Instance",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(jvm_memory_used_bytes{service=~\"$service\"}, instance)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "title": "Active instances",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(up{service=~\"$service\", instance=~\"$instance\"} == 1)",
              "legendFormat": "instances"
            }
          ],
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "title": "HTTP request rate",
          "type": "timeseries",
          "gridPos": { "x": 4, "y": 0, "w": 10, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=~\"$service\", instance=~\"$instance\"}[1m])) by (instance, uri, method)",
              "legendFormat": "{{instance}} {{method}} {{uri}}"
            }
          ]
        },
        {
          "title": "HTTP error rate",
          "type": "timeseries",
          "gridPos": { "x": 14, "y": 0, "w": 10, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=~\"$service\", instance=~\"$instance\", status=~\"5..\"}[1m])) by (instance) / sum(rate(http_server_requests_seconds_count{service=~\"$service\", instance=~\"$instance\"}[1m])) by (instance) * 100",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "title": "JVM memory used",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{service=~\"$service\", instance=~\"$instance\"}) by (instance, area)",
              "legendFormat": "{{instance}} {{area}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "title": "CPU usage",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "process_cpu_usage{service=~\"$service\", instance=~\"$instance\"} * 100",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "title": "Logs by service",
          "type": "logs",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{service=~\"$service\"}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Recent traces",
          "type": "traces",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [
            {
              "query": "{ resource.service.name =~ \"$service\" }",
              "queryType": "traceql",
              "refId": "A"
            }
          ]
        }
      ]
    }

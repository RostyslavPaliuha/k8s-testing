apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-gateway-deployment
  namespace: ingress-gateway-ns
  labels:
    app: ingress-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingress-gateway
  template:
    metadata:
      annotations:
        resource.opentelemetry.io/service.name: gateway
        resource.opentelemetry.io/service.namespace: ingress-gateway
      labels:
        app: ingress-gateway
    spec:
      containers:
        - name: ingress-gateway
          image: gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9876
              name: debug
              protocol: TCP
            - containerPort: 9875
              name: jmx
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9876
                -Dcom.sun.management.jmxremote=true
                -Dcom.sun.management.jmxremote.port=9875
                -Dcom.sun.management.jmxremote.rmi.port=9875
                -Dcom.sun.management.jmxremote.local.only=false
                -Dcom.sun.management.jmxremote.authenticate=false
                -Dcom.sun.management.jmxremote.ssl=false
                -Dcom.sun.management.jmxremote.host=0.0.0.0
                -Djava.rmi.server.hostname=127.0.0.1
            - name: OTEL_SERVICE_NAME
              value: gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=ingress-gateway,k8s.namespace.name=ingress-gateway-ns
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: ingress-gateway-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "768Mi"
              cpu: "600m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}

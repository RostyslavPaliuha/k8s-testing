apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-catalog-ingress
  namespace: demo-catalog-ns
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://127.0.0.1:8081"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: local.ks.tv
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: demo-catalog
                port:
                  name: http

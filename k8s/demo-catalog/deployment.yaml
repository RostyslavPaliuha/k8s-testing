apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-catalog-deployment
  namespace: demo-catalog-ns
  labels:
    app: demo-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-catalog
  template:
    metadata:
      annotations:
        resource.opentelemetry.io/service.name: catalog
        resource.opentelemetry.io/service.namespace: demo-catalog
      labels:
        app: demo-catalog
    spec:
      containers:
        - name: demo-catalog
          image: catalog:v9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
              protocol: TCP
            - containerPort: 9876
              name: debug
              protocol: TCP
            - containerPort: 9875
              name: jmx
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9876
                -Dcom.sun.management.jmxremote=true
                -Dcom.sun.management.jmxremote.port=9875
                -Dcom.sun.management.jmxremote.rmi.port=9875
                -Dcom.sun.management.jmxremote.local.only=false
                -Dcom.sun.management.jmxremote.authenticate=false
                -Dcom.sun.management.jmxremote.ssl=false
                -Dcom.sun.management.jmxremote.host=0.0.0.0
                -Djava.rmi.server.hostname=127.0.0.1
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOKI_URL
              value: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
          envFrom:
            - configMapRef:
                name: demo-catalog-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}

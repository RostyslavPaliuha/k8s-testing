apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoon-deployment
  namespace: mockoon-ns
  labels:
    app: mockoon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockoon
  template:
    metadata:
      labels:
        app: mockoon
    spec:
      containers:
        - name: mockoon
          image: mockoon/cli:latest
          imagePullPolicy: Always
          args:
            - "-d"
            - "/data/mockoon-data.json"
            - "-p"
            - "3000"
            - "--hostname"
            - "0.0.0.0"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: mockoon-config
              mountPath: /data/mockoon-data.json
              subPath: mockoon-data.json
              readOnly: true
      volumes:
        - name: mockoon-config
          configMap:
            name: mockoon-config

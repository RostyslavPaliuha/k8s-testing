# Serving cert for the Vault UI ingress.
#
# Issued from the internal CA, which browsers will not trust locally — swap
# issuerRef to an ACME/ACM ClusterIssuer for a publicly resolvable prod host,
# or drop in an mkcert secret named vault.local.ks.tv the way the other
# *.local.ks.tv hosts in this repo do.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ingress-tls
  namespace: vault-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: vault.local.ks.tv
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  commonName: vault.local.ks.tv
  dnsNames:
    - vault.local.ks.tv

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-injector-tls
  namespace: vault-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: vault-injector-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  commonName: vault-agent-injector-svc.vault-ns.svc
  # The apiserver reaches the webhook as <svc>.<ns>.svc, so that name must be
  # present; the shorter forms mirror the chart's own AGENT_INJECT_TLS_AUTO_HOSTS.
  dnsNames:
    - vault-agent-injector-svc
    - vault-agent-injector-svc.vault-ns
    - vault-agent-injector-svc.vault-ns.svc
    - vault-agent-injector-svc.vault-ns.svc.cluster.local

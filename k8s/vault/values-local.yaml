# Local-only delta layered on top of values.yaml.
#
# values.yaml stays the production (EKS) source of truth; this file overrides
# only what a single-node Docker Desktop cluster cannot satisfy.
#
# The seal stays awskms — same stanza, same Vault code path as prod. Only the
# endpoint and credentials differ: locally it points at the LocalStack KMS
# emulator from cluster-components/localstack.yml, where prod uses IRSA against
# real KMS. Auto-unseal therefore behaves locally exactly as it will in prod,
# including across pod restarts.
server:
  dataStorage:
    # No EBS locally; matches the storageClass the postgres chart uses.
    storageClass: hostpath

  # One node means the hostname anti-affinity from values.yaml can never be
  # satisfied by a second replica. Empty string removes it entirely.
  affinity: ""

  ha:
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      # Duplicated from values.yaml rather than patched — Helm cannot merge into
      # a config string. Keep the listener block in sync with values.yaml; the
      # deliberate differences are the single retry_join and the seal endpoint.
      config: |
        ui = true

        listener "tcp" {
          address            = "[::]:8200"
          cluster_address    = "[::]:8201"
          tls_cert_file      = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file       = "/vault/userconfig/vault-tls/tls.key"

          tls_disable_client_certs = true
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr     = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
        }

        seal "awskms" {
          region     = "eu-central-1"
          kms_key_id = "alias/vault-unseal"
          # LocalStack accepts any credentials; these are not secrets.
          endpoint   = "http://localstack.localstack-ns.svc:4566"
          access_key = "test"
          secret_key = "test"
        }

        service_registration "kubernetes" {}

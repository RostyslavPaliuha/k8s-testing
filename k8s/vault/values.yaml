global:
  enabled: true
  tlsDisable: false

injector:
  enabled: true

  # Serve the webhook with a cert from the cluster's internal CA instead of the
  # injector's self-managed one, so every component chains to the same root.
  certs:
    secretName: vault-injector-tls

  webhook:
    annotations:
      # cainjector keeps caBundle on the MutatingWebhookConfiguration in sync.
      # Argo must ignore that field — see ignoreDifferences on the Application.
      cert-manager.io/inject-ca-from: vault-ns/vault-injector-tls

server:
  serviceAccount:
    create: true
    name: vault
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/vault-kms-unseal

  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt

  statefulSet:
    annotations:
      # Vault does not re-read its cert from disk, so a cert-manager renewal
      # would otherwise serve a stale cert until someone restarts the pods.
      secret.reloader.stakater.com/reload: vault-tls

  ingress:
    enabled: true
    ingressClassName: nginx
    # Points the ingress at the vault-active service, so traffic only ever
    # reaches the current raft leader.
    activeService: true
    annotations:
      # Vault terminates its own TLS, so nginx must speak HTTPS upstream.
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: vault.local.ks.tv
        paths: []
    tls:
      - secretName: vault.local.ks.tv
        hosts:
          - vault.local.ks.tv

  volumes:
    - name: vault-tls
      secret:
        secretName: vault-tls

  volumeMounts:
    - name: vault-tls
      mountPath: /vault/userconfig/vault-tls
      readOnly: true

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: gp3

  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ template "vault.name" . }}
              component: server
          topologyKey: kubernetes.io/hostname

  ha:
    enabled: true
    replicas: 3
    # The chart's default is https://$(POD_IP):8200, and a pod IP can never
    # appear in the certificate, so clients redirected to the active node would
    # hit an x509 error. Uses VAULT_K8S_POD_NAME rather than HOSTNAME because
    # only the former is declared before VAULT_API_ADDR in the container's env
    # list, which is what Kubernetes requires for $(VAR) expansion.
    apiAddr: "https://$(VAULT_K8S_POD_NAME).vault-internal.vault-ns.svc.cluster.local:8200"
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address            = "[::]:8200"
          cluster_address    = "[::]:8201"
          tls_cert_file      = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file       = "/vault/userconfig/vault-tls/tls.key"

          # We do not use client-certificate auth. Without this, setting a
          # client CA would make Vault request a client cert on every handshake.
          tls_disable_client_certs = true
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr     = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr     = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr     = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
          }
        }

        seal "awskms" {
          region     = "eu-central-1"
          kms_key_id = "alias/vault-unseal"
        }

        service_registration "kubernetes" {}

  ui:
    enabled: true
    serviceType: ClusterIP
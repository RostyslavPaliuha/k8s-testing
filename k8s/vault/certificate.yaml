apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault-ns
  annotations:
    # Issue the cert before the Helm chart's StatefulSet tries to mount it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: vault-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  commonName: vault.vault-ns.svc.cluster.local
  dnsNames:
    - vault
    - vault.vault-ns
    - vault.vault-ns.svc
    - vault.vault-ns.svc.cluster.local
    - vault-0.vault-internal
    - vault-1.vault-internal
    - vault-2.vault-internal
    - "*.vault-internal"
    - "*.vault-internal.vault-ns.svc.cluster.local"
  # The chart sets VAULT_ADDR=https://127.0.0.1:8200, which every in-pod `vault`
  # call uses — including the exec readiness probe. Without this IP SAN the
  # probe fails x509 verification and the pod never becomes Ready.
  ipAddresses:
    - 127.0.0.1

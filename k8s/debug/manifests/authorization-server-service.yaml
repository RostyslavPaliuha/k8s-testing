apiVersion: v1
kind: Service
metadata:
  name: authorization-server
  namespace: authorization-server-ns
  labels:
    app: authorization-server
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9000
      name: http
    - port: 9876
      targetPort: 9876
      name: debug
    - port: 9875
      targetPort: 9875
      name: jmx
  selector:
    app: authorization-server

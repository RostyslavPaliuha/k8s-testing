apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-system-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Pods metrics"
data:
  spring-boot-system-authorization-server.json: |-
    {
      "uid": "spring-system-authorization-server",
      "title": "authorization-server / System Metrics",
      "tags": ["spring-boot", "system", "authorization-server"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(process_cpu_usage{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\"}, k8s_pod_name)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Service Status",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Uptime",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "max(process_uptime_milliseconds{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "decimals": 1,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "count(count by(k8s_pod_name) (process_cpu_usage{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Start Time",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "max(process_start_time_milliseconds{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1}
        },
        {
          "id": 5,
          "type": "table",
          "title": "Version",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "count by(service_version, container_image_tag) (process_cpu_usage{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"align": "auto", "cellOptions": {"type": "auto"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"showHeader": true, "cellHeight": "sm", "footer": {"show": false, "reducer": ["sum"], "countRows": false, "fields": ""}},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1}
        },
        {
          "id": 6,
          "type": "row",
          "title": "System and Process",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Usage",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "process_cpu_usage{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "process {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "system_cpu_usage{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "system {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.7}, {"color": "red", "value": 0.9}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"]}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Load Average and CPU Count",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "system_load_average_1m{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "load {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "system_cpu_count{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "cpu count {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"]}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Disk Space",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "disk_free_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "free {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "disk_total_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "total {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"]}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "JVM Buffer Pools",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(k8s_pod_name, id) (jvm_buffer_memory_used_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})",
              "legendFormat": "{{id}} used {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "sum by(k8s_pod_name, id) (jvm_buffer_total_capacity_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})",
              "legendFormat": "{{id}} capacity {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"]}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14}
        },
        {
          "id": 11,
          "type": "row",
          "title": "JVM",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Heap Memory",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(k8s_pod_name) (jvm_memory_used_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\",area=\"heap\"})",
              "legendFormat": "used {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "sum by(k8s_pod_name) (jvm_memory_committed_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\",area=\"heap\"})",
              "legendFormat": "committed {{k8s_pod_name}}"
            },
            {
              "refId": "C",
              "expr": "sum by(k8s_pod_name) (jvm_memory_max_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\",area=\"heap\"})",
              "legendFormat": "max {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"]}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 23}
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Non-Heap Memory",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(k8s_pod_name) (jvm_memory_used_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\",area=\"nonheap\"})",
              "legendFormat": "used {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "sum by(k8s_pod_name) (jvm_memory_committed_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\",area=\"nonheap\"})",
              "legendFormat": "committed {{k8s_pod_name}}"
            },
            {
              "refId": "C",
              "expr": "sum by(k8s_pod_name) (jvm_memory_max_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\",area=\"nonheap\"})",
              "legendFormat": "max {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"]}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 23}
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Memory Pools",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(id) (jvm_memory_used_bytes{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})",
              "legendFormat": "{{id}} used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"]}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 31}
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Threads",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_threads_live{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "live {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "jvm_threads_daemon{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "daemon {{k8s_pod_name}}"
            },
            {
              "refId": "C",
              "expr": "jvm_threads_peak{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "peak {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"]}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 31}
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Thread States",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(state) (jvm_threads_states{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"})",
              "legendFormat": "{{state}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "lineInterpolation": "linear", "barAlignment": 0, "lineWidth": 1, "fillOpacity": 10, "gradientMode": "none", "spanNulls": false, "insertNulls": false, "showPoints": "never", "pointSize": 5, "stacking": {"mode": "none", "group": "A"}, "axisPlacement": "auto", "axisLabel": "", "axisColorMode": "text", "scaleDistribution": {"type": "linear"}, "hideFrom": {"tooltip": false, "viz": false, "legend": false}, "thresholdsStyle": {"mode": "off"}},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"tooltip": {"mode": "multi", "sort": "none"}, "legend": {"showLegend": true, "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull"]}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 39}
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Class Loading",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_classes_loaded{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}",
              "legendFormat": "loaded {{k8s_pod_name}}"
            },
            {
              "refId": "B",
              "expr": "rate(jvm_classes_unloaded_total{service_name=\"authorization-server\",service_namespace=\"authorization-server\",k8s_namespace_name=\"authorization-server-ns\",k8s_container_name=\"authorization-server\",k8s_pod_name=~\"$pod\"}[5m])",
              "legendFormat": "unloaded/s {{k8s_pod_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",

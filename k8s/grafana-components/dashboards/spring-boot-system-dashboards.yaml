  spring-boot-system-catalog.json: |-
    {
      "uid": "spring-system-catalog",
      "title": "catalog / System Metrics",
      "tags": ["spring-boot", "system", "catalog"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(process_cpu_usage{service_name=\"catalog\",service_namespace=\"demo-catalog\",k8s_namespace_name=\"demo-catalog-ns\",k8s_container_name=\"demo-catalog\"}, k8s_pod_name)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Service Status",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Uptime",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [

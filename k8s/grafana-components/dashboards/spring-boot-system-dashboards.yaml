          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Start Time",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "max(process_start_time_milliseconds{service_name=\"catalog\",service_namespace=\"demo-catalog\",k8s_namespace_name=\"demo-catalog-ns\",k8s_container_name=\"demo-catalog\",k8s_pod_name=~\"$pod\"})"
            }

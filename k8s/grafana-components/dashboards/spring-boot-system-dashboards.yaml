              "refId": "A",
              "expr": "max(process_uptime_milliseconds{service_name=\"catalog\",service_namespace=\"demo-catalog\",k8s_namespace_name=\"demo-catalog-ns\",k8s_container_name=\"demo-catalog\",k8s_pod_name=~\"$pod\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "decimals": 1,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "count(count by(k8s_pod_name) (process_cpu_usage{service_name=\"catalog\",service_namespace=\"demo-catalog\",k8s_namespace_name=\"demo-catalog-ns\",k8s_container_name=\"demo-catalog\",k8s_pod_name=~\"$pod\"}))"
            }

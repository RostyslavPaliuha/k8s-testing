# Local variant of the vault Application: same chart, same manifests, same
# certificates — only values-local.yaml is layered on top. Later valueFiles win,
# so the single-node overrides take effect while everything else comes from the
# production values.
#
# bootstrap.sh applies this one. Use argo-application-vault.yml for EKS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.0
      helm:
        valueFiles:
          - $values/k8s/vault/values.yaml
          - $values/k8s/vault/values-local.yaml
    - repoURL: https://github.com/RostyslavPaliuha/k8s-testing
      targetRevision: master
      path: k8s/vault
      directory:
        include: "*certificate.yaml"
    - repoURL: https://github.com/RostyslavPaliuha/k8s-testing
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-ns
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

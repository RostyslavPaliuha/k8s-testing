apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-boot-observability-examples
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_GIT_REPO_URL
    targetRevision: REPLACE_WITH_GIT_BRANCH
    path: grapha-k8s/examples
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: "*"
      helm:
        releaseName: alloy
        valueFiles:
          - $values/grapha-k8s/values/alloy.yaml
    - repoURL: REPLACE_WITH_GIT_REPO_URL
      targetRevision: REPLACE_WITH_GIT_BRANCH
      ref: values

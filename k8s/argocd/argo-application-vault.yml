apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.0
      helm:
        valueFiles:
          - $values/k8s/vault/values.yaml
    - repoURL: https://github.com/RostyslavPaliuha/k8s-testing
      targetRevision: master
      path: k8s/vault
      directory:
        include: "*certificate.yaml"
    - repoURL: https://github.com/RostyslavPaliuha/k8s-testing
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-ns
  # cert-manager's cainjector writes caBundle into the webhook at runtime.
  # Without this, selfHeal would revert it and break the injector.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

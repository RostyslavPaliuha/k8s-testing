apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mockoon
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RostyslavPaliuha/k8s-testing
    targetRevision: master
    path: k8s/mockoon
  destination:
    server: https://kubernetes.default.svc
    namespace: mockoon-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

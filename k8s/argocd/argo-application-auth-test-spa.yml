apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-test-spa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RostyslavPaliuha/k8s-testing
    targetRevision: master
    path: k8s/auth-test-spa
  destination:
    server: https://kubernetes.default.svc
    namespace: auth-test-spa-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

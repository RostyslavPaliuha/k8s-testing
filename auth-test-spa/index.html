<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Київстар ТБ - Каталог</title>
    <style>
        :root {
            color-scheme: dark;
            --page-bg: #101620;
            --surface: rgba(22, 28, 38, 0.92);
            --surface-strong: rgba(22, 28, 38, 0.98);
            --surface-muted: #3c4a5e;
            --accent: #007bff;
            --accent-soft: rgba(0, 123, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8c98a9;
            --danger: #ff6b6b;
            --danger-soft: rgba(255, 107, 107, 0.2);
            --shadow: 0 8px 24px rgba(0, 123, 255, 0.3);
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--page-bg);
            color: var(--text-primary);
        }

        body {
            min-height: 100vh;
        }

        .catalog-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 15px 30px;
            background-color: var(--surface);
            border-bottom: 1px solid var(--surface-muted);
        }

        .header-logo {
            display: flex;
            align-items: center;
        }

        .header-logo img {
            display: block;
            height: 40px;
            width: auto;
        }

        .user-profile-wrapper {
            position: relative;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .user-profile:hover,
        .user-profile[aria-expanded="true"] {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .user-profile-name {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
        }

        .user-profile-picture {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--accent);
            color: var(--text-primary);
            font-weight: 600;
        }

        .user-profile-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 1000;
            min-width: 150px;
            display: none;
            background-color: var(--surface-strong);
            border: 1px solid var(--surface-muted);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .user-profile-dropdown.show {
            display: block;
        }

        .user-profile-dropdown button {
            width: 100%;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-primary);
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .user-profile-dropdown button:hover {
            background-color: var(--danger-soft);
            color: var(--danger);
        }

        .catalog-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .catalog-title {
            margin: 0 0 25px;
            font-size: 28px;
            font-weight: 600;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .asset-card {
            overflow: hidden;
            border-radius: 12px;
            background-color: rgba(22, 28, 38, 0.8);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .asset-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .asset-poster {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background-color: var(--surface-muted);
        }

        .asset-info {
            padding: 15px;
        }

        .asset-name {
            margin: 0 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
        }

        .asset-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .asset-badge {
            padding: 3px 8px;
            border-radius: 4px;
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .state {
            padding: 60px 20px;
            text-align: center;
        }

        .state-message {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .state-message.error {
            color: var(--danger);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid var(--surface-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 560px) {
            .catalog-header {
                padding: 12px 16px;
            }

            .header-logo img {
                height: 32px;
            }

            .user-profile {
                padding: 6px 8px;
            }

            .user-profile-name {
                max-width: 110px;
            }

            .catalog-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
            }
        }
    </style>
</head>
<body>
<header class="catalog-header">
    <div class="header-logo">
        <img src="https://tv.kyivstar.ua/assets/img/logo/logo-ua.svg" alt="Kyivstar TV Logo">
    </div>
    <div class="user-profile-wrapper">
        <button type="button" class="user-profile" id="userProfileBtn" aria-expanded="false" aria-controls="userProfileDropdown">
            <span class="user-profile-name" id="userProfileName">Користувач</span>
            <span class="user-profile-picture" id="userProfileAvatar">К</span>
        </button>
        <div class="user-profile-dropdown" id="userProfileDropdown">
            <button type="button" id="logoutBtn">Вийти</button>
        </div>
    </div>
</header>

<main class="catalog-container">
    <h1 class="catalog-title">Каталог контенту</h1>
    <section id="catalogContent" aria-live="polite"></section>
</main>

<script>
    const CONFIG = {
        loginUrl: 'https://local.api.ks.tv/oauth2/authorization/gateway',
        loginPageUrl: 'https://local.ks.tv/authorization/login',
        userInfoUrl: 'https://local.api.ks.tv/identity/api/v1/userinfo',
        catalogUrl: 'https://local.api.ks.tv/catalog/api/v1/assets',
        logoutUrl: 'https://local.ks.tv/logout',
        fallbackPoster: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%233c4a5e%22 width=%22200%22 height=%22300%22/%3E%3Ctext fill=%22%238c98a9%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3ENo Image%3C/text%3E%3C/svg%3E'
    };

    let isLoggingOut = false;

    const elements = {
        catalogContent: document.getElementById('catalogContent'),
        userProfileBtn: document.getElementById('userProfileBtn'),
        userProfileDropdown: document.getElementById('userProfileDropdown'),
        userProfileName: document.getElementById('userProfileName'),
        userProfileAvatar: document.getElementById('userProfileAvatar'),
        logoutBtn: document.getElementById('logoutBtn')
    };

    function authFetch(url, options) {
        return fetch(url, {
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            ...options
        });
    }

    function redirectToLogin(url) {
        window.location.href = url || CONFIG.loginUrl;
    }

    function extractRedirectUrlFromText(text) {
        if (!text) {
            return '';
        }

        const patterns = [
            /<meta[^>]+http-equiv=["']refresh["'][^>]+url=([^"'>\s]+)/i,
            /window\.location(?:\.href)?\s*=\s*["']([^"']+)["']/i,
            /window\.location\.(?:replace|assign)\(["']([^"']+)["']\)/i,
            /location(?:\.href)?\s*=\s*["']([^"']+)["']/i
        ];

        for (const pattern of patterns) {
            const match = text.match(pattern);

            if (match && match[1]) {
                return match[1];
            }
        }

        return '';
    }

    function resolveRedirectUrl(candidate) {
        if (!candidate) {
            return '';
        }

        try {
            return new URL(candidate, window.location.href).href;
        } catch (_) {
            return '';
        }
    }

    async function getRedirectTarget(response) {
        const headerCandidates = [
            response.headers.get('Location'),
            response.headers.get('X-Redirect-To'),
            response.headers.get('X-Login-Url'),
            response.headers.get('X-Auth-Redirect')
        ];

        for (const candidate of headerCandidates) {
            const resolved = resolveRedirectUrl(candidate);

            if (resolved) {
                return resolved;
            }
        }

        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('application/json')) {
            try {
                const payload = await response.clone().json();
                const jsonCandidates = [
                    payload && payload.redirectUrl,
                    payload && payload.redirect_url,
                    payload && payload.redirectUri,
                    payload && payload.redirect_uri,
                    payload && payload.location,
                    payload && payload.url,
                    payload && payload.href,
                    payload && payload.loginUrl
                ];

                for (const candidate of jsonCandidates) {
                    const resolved = resolveRedirectUrl(candidate);

                    if (resolved) {
                        return resolved;
                    }
                }
            } catch (_) {
            }
        }

        if (contentType.includes('text/html')) {
            try {
                const html = await response.clone().text();
                const resolved = resolveRedirectUrl(extractRedirectUrlFromText(html));

                if (resolved) {
                    return resolved;
                }
            } catch (_) {
            }
        }

        return response.redirected ? resolveRedirectUrl(response.url) : '';
    }

    function normalizeUserPayload(userInfo) {
        if (!userInfo || typeof userInfo !== 'object') {
            return {};
        }

        return {
            ...userInfo,
            ...(userInfo.claims || {}),
            ...(userInfo.attributes || {})
        };
    }

    function getUserDisplayName(userInfo) {
        const user = normalizeUserPayload(userInfo);
        return user.name || user.preferred_username || user.email || user.sub || 'Користувач';
    }

    function getUserPicture(userInfo) {
        return normalizeUserPayload(userInfo).picture || '';
    }

    function getInitial(value) {
        return (value || '').trim().charAt(0).toUpperCase() || 'К';
    }

    function createState(message, options) {
        const settings = options || {};
        const state = document.createElement('div');
        const text = document.createElement('div');

        state.className = 'state';
        text.className = 'state-message' + (settings.isError ? ' error' : '');
        text.textContent = message;

        if (settings.isLoading) {
            const spinner = document.createElement('div');
            spinner.className = 'loading-spinner';
            state.appendChild(spinner);
        }

        state.appendChild(text);
        return state;
    }

    function renderState(message, options) {
        elements.catalogContent.replaceChildren(createState(message, options));
    }

    function createBadge(text) {
        const badge = document.createElement('span');
        badge.className = 'asset-badge';
        badge.textContent = text;
        return badge;
    }

    function getReleaseYear(asset) {
        if (!asset || !asset.releaseDate) {
            return 'N/A';
        }

        const match = String(asset.releaseDate).match(/\d{4}/);
        return match ? match[0] : String(asset.releaseDate);
    }

    function choosePosterUrl(asset) {
        const imageSources = Array.isArray(asset && asset.imagesSource) ? asset.imagesSource : [];
        const candidates = [];

        imageSources.forEach(function(source) {
            const baseUrl = source && source.url;
            const files = Array.isArray(source && source.imgFiles) ? source.imgFiles : [];

            files.forEach(function(file) {
                if (baseUrl && file && file.fileName) {
                    candidates.push(baseUrl.replace(/\/$/, '') + '/' + file.fileName);
                }
            });
        });

        return candidates.find(function(url) { return url.includes('IMAGE_2_3_XL'); })
            || candidates.find(function(url) { return url.includes('IMAGE_2_3_L'); })
            || candidates.find(function(url) { return url.includes('IMAGE_2_3_'); })
            || CONFIG.fallbackPoster;
    }

    function createAssetCard(asset) {
        const card = document.createElement('article');
        const poster = document.createElement('img');
        const info = document.createElement('div');
        const title = document.createElement('h3');
        const meta = document.createElement('div');
        const assetName = asset && asset.name ? asset.name : 'Asset Name';

        card.className = 'asset-card';
        card.dataset.assetId = asset && asset.assetId ? asset.assetId : '';

        poster.className = 'asset-poster';
        poster.src = choosePosterUrl(asset);
        poster.alt = assetName;
        poster.onerror = function() {
            poster.onerror = null;
            poster.src = CONFIG.fallbackPoster;
        };

        info.className = 'asset-info';

        title.className = 'asset-name';
        title.textContent = assetName;
        title.title = assetName;

        meta.className = 'asset-meta';
        meta.append(
            createBadge(asset && asset.assetType ? asset.assetType : 'Відео'),
            createBadge(getReleaseYear(asset))
        );

        info.append(title, meta);
        card.append(poster, info);

        return card;
    }

    function renderCatalog(catalog) {
        const assets = Array.isArray(catalog && catalog.assets) ? catalog.assets : [];

        if (!assets.length) {
            renderState('Каталог порожній');
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'catalog-grid';
        grid.append(...assets.map(createAssetCard));
        elements.catalogContent.replaceChildren(grid);
    }

    function closeUserProfileDropdown() {
        elements.userProfileDropdown.classList.remove('show');
        elements.userProfileBtn.setAttribute('aria-expanded', 'false');
    }

    function openUserProfileDropdown() {
        elements.userProfileDropdown.classList.add('show');
        elements.userProfileBtn.setAttribute('aria-expanded', 'true');
    }

    function toggleUserProfileDropdown() {
        if (elements.userProfileDropdown.classList.contains('show')) {
            closeUserProfileDropdown();
            return;
        }

        openUserProfileDropdown();
    }

    function renderUserProfile(userInfo) {
        const name = getUserDisplayName(userInfo);
        const picture = getUserPicture(userInfo);

        elements.userProfileName.textContent = name;
        elements.userProfileName.title = name;

        if (!picture) {
            elements.userProfileAvatar.textContent = getInitial(name);
            elements.userProfileAvatar.style.backgroundImage = '';
            elements.userProfileAvatar.style.backgroundSize = '';
            elements.userProfileAvatar.style.backgroundPosition = '';
            return;
        }

        elements.userProfileAvatar.textContent = '';
        elements.userProfileAvatar.style.backgroundImage = 'url("' + picture.replace(/"/g, '\\"') + '")';
        elements.userProfileAvatar.style.backgroundSize = 'cover';
        elements.userProfileAvatar.style.backgroundPosition = 'center';

        const image = new Image();
        image.onerror = function() {
            elements.userProfileAvatar.style.backgroundImage = '';
            elements.userProfileAvatar.style.backgroundSize = '';
            elements.userProfileAvatar.style.backgroundPosition = '';
            elements.userProfileAvatar.textContent = getInitial(name);
        };
        image.src = picture;
    }

    async function fetchProtectedJson(url) {
        const response = await authFetch(url);
        const contentType = response.headers.get('content-type') || '';

        if (response.redirected) {
            redirectToLogin(await getRedirectTarget(response));
            return null;
        }

        if (response.status === 401) {
            redirectToLogin(await getRedirectTarget(response));
            return null;
        }

        if (!response.ok) {
            throw new Error(String(response.status));
        }

        if (!contentType.includes('application/json')) {
            redirectToLogin(await getRedirectTarget(response));
            return null;
        }

        return response.json();
    }

    async function loadAuthenticatedUserProfile() {
        const userInfo = await fetchProtectedJson(CONFIG.userInfoUrl);

        if (!userInfo) {
            return null;
        }

        renderUserProfile(userInfo);
        return userInfo;
    }

    async function loadCatalog() {
        renderState('Завантаження каталогу...', { isLoading: true });

        try {
            const catalog = await fetchProtectedJson(CONFIG.catalogUrl);

            if (catalog) {
                renderCatalog(catalog);
            }
        } catch (error) {
            renderState('Error: catalog request failed with status ' + error.message, { isError: true });
        }
    }

    function clearClientSession() {
        localStorage.clear();
        sessionStorage.clear();
    }

    async function logout() {
        if (isLoggingOut) {
            return;
        }

        isLoggingOut = true;
        closeUserProfileDropdown();
        elements.logoutBtn.disabled = true;
        elements.logoutBtn.textContent = 'Вихід...';

        try {
            await fetch(CONFIG.logoutUrl, {
                method: 'POST',
                credentials: 'include',
                redirect: 'manual',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            });
        } catch (_) {
        } finally {
            clearClientSession();
            window.location.href = CONFIG.loginPageUrl;
        }
    }

    function setupUserProfileDropdown() {
        elements.userProfileBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            toggleUserProfileDropdown();
        });



        document.addEventListener('click', function(event) {
            if (!elements.userProfileBtn.contains(event.target) && !elements.userProfileDropdown.contains(event.target)) {
                closeUserProfileDropdown();
            }
        });

        elements.logoutBtn.addEventListener('click', logout);
    }

    async function init() {
        setupUserProfileDropdown();
        renderState('Завантаження каталогу...', { isLoading: true });

        try {
            const userInfo = await loadAuthenticatedUserProfile();

            if (userInfo) {
                await loadCatalog();
            }
        } catch (error) {
            renderState('Error: user info request failed with status ' + error.message, { isError: true });
        }
    }

    window.addEventListener('load', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Київстар ТБ - Каталог</title>
    <style>
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: auto;
            display: block !important;
            background: #101620;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        body {
            position: relative;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(22, 28, 38, 0.95);
            border-bottom: 1px solid #3c4a5e;
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 100;
            box-sizing: border-box;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo img {
            height: 40px;
            width: auto;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .user-profile:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .user-profile-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-profile-picture {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #007bff;
            box-sizing: border-box;
        }

        .user-profile-initial {
            background-color: #007bff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-profile-wrapper {
            position: relative;
        }

        .user-profile-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: rgba(22, 28, 38, 0.98);
            border: 1px solid #3c4a5e;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            min-width: 150px;
            display: none;
            z-index: 1000;
        }

        .user-profile-dropdown.show {
            display: block;
        }

        .user-profile-dropdown button {
            display: block;
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .user-profile-dropdown button:hover {
            background-color: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .user-profile-dropdown button:first-child {
            border-radius: 8px 8px 0 0;
        }

        .user-profile-dropdown button:last-child {
            border-radius: 0 0 8px 8px;
        }

        .catalog-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .catalog-title {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 25px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .asset-card {
            background-color: rgba(22, 28, 38, 0.8);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .asset-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 123, 255, 0.3);
        }

        .asset-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
            background-color: #3c4a5e;
        }

        .asset-info {
            padding: 15px;
        }

        .asset-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .asset-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: #8c98a9;
        }

        .asset-type, .asset-year {
            background-color: rgba(0, 123, 255, 0.2);
            color: #007bff;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .loading-container,
        .error-container,
        .no-assets {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #3c4a5e;
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text,
        .no-assets {
            color: #8c98a9;
            font-size: 16px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 16px;
            margin-top: 10px;
        }

        @media (max-width: 560px) {
            .catalog-header {
                padding: 12px 16px;
            }

            .header-logo img {
                height: 32px;
            }

            .user-profile {
                padding: 6px 8px;
            }

            .user-profile-name {
                max-width: 110px;
            }

            .catalog-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
            }
        }
    </style>
</head>
<body>
<header class="catalog-header">
    <div class="header-logo">
        <img src="https://tv.kyivstar.ua/assets/img/logo/logo-ua.svg" alt="Kyivstar TV Logo">
    </div>
    <div class="user-profile-wrapper">
        <div class="user-profile" id="userProfileBtn">
            <span class="user-profile-name" id="userProfileName">Користувач</span>
            <div class="user-profile-picture user-profile-initial" id="userProfileInitial">К</div>
        </div>
        <div class="user-profile-dropdown" id="userProfileDropdown">
            <button type="button" id="logoutBtn">Вийти</button>
        </div>
    </div>
</header>

<main class="catalog-container">
    <h1 class="catalog-title">Каталог контенту</h1>
    <section id="catalogContent" aria-live="polite">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Завантаження каталогу...</div>
        </div>
    </section>
</main>

<script>
    const LOGIN_URL = 'https://local.ks.tv/authorization/login';
    const USERINFO_URL = 'https://local.ks.tv/identity/api/v1/userinfo';
    const CATALOG_URL = 'https://local.ks.tv/catalog/api/v1/assets';
    const LOGOUT_URL = 'https://local.ks.tv/logout';
    const FALLBACK_POSTER = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%233c4a5e%22 width=%22200%22 height=%22300%22/%3E%3Ctext fill=%22%238c98a9%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3ENo Image%3C/text%3E%3C/svg%3E';

    function authFetch(url) {
        return fetch(url, {
            headers: {'Content-Type': 'application/json'},
            credentials: 'include'
        });
    }

    function redirectToLogin(url) {
        window.location.href = url || LOGIN_URL;
    }

    function normalizeUserPayload(userInfo) {
        if (!userInfo || typeof userInfo !== 'object') {
            return {};
        }

        return {
            ...userInfo,
            ...(userInfo.claims || {}),
            ...(userInfo.attributes || {})
        };
    }

    function userDisplayName(userInfo) {
        const user = normalizeUserPayload(userInfo);
        return user.name || user.preferred_username || user.email || user.sub || 'Користувач';
    }

    function userPicture(userInfo) {
        const user = normalizeUserPayload(userInfo);
        return user.picture || null;
    }

    function renderUserProfile(userInfo) {
        const name = userDisplayName(userInfo);
        const picture = userPicture(userInfo);
        const nameElement = document.getElementById('userProfileName');
        const existingPictureElement = document.getElementById('userProfileInitial') || document.querySelector('.user-profile-picture');

        nameElement.textContent = name;
        nameElement.title = name;

        if (!picture) {
            existingPictureElement.textContent = name.trim().charAt(0).toUpperCase() || 'К';
            return;
        }

        const image = document.createElement('img');
        image.className = 'user-profile-picture';
        image.id = 'userProfileInitial';
        image.src = picture;
        image.alt = 'Profile';
        image.onerror = function() {
            const fallback = document.createElement('div');
            fallback.className = 'user-profile-picture user-profile-initial';
            fallback.id = 'userProfileInitial';
            fallback.textContent = name.trim().charAt(0).toUpperCase() || 'К';
            image.replaceWith(fallback);
        };

        existingPictureElement.replaceWith(image);
    }

    async function loadUserProfile() {
        const response = await authFetch(USERINFO_URL);

        if (response.redirected) {
            redirectToLogin(response.url);
            return;
        }

        if (response.status === 401) {
            redirectToLogin();
            return;
        }

        if (!response.ok) {
            return;
        }

        renderUserProfile(await response.json());
    }

    function choosePosterUrl(asset) {
        const imageSources = Array.isArray(asset.imagesSource) ? asset.imagesSource : [];
        const candidates = [];

        imageSources.forEach(function(source) {
            const baseUrl = source && source.url;
            const files = source && Array.isArray(source.imgFiles) ? source.imgFiles : [];

            files.forEach(function(file) {
                if (baseUrl && file && file.fileName) {
                    candidates.push(baseUrl.replace(/\/$/, '') + '/' + file.fileName);
                }
            });
        });

        return candidates.find(function(url) { return url.includes('IMAGE_2_3_XL'); })
            || candidates.find(function(url) { return url.includes('IMAGE_2_3_L'); })
            || candidates.find(function(url) { return url.includes('IMAGE_2_3_'); })
            || FALLBACK_POSTER;
    }

    function renderLoading() {
        document.getElementById('catalogContent').innerHTML =
            '<div class="loading-container">' +
            '<div class="loading-spinner"></div>' +
            '<div class="loading-text">Завантаження каталогу...</div>' +
            '</div>';
    }

    function renderError(message) {
        const content = document.getElementById('catalogContent');
        content.innerHTML = '';

        const container = document.createElement('div');
        container.className = 'error-container';

        const error = document.createElement('div');
        error.className = 'error-message';
        error.textContent = message;

        container.appendChild(error);
        content.appendChild(container);
    }

    function renderNoAssets() {
        const content = document.getElementById('catalogContent');
        content.innerHTML = '';

        const empty = document.createElement('div');
        empty.className = 'no-assets';
        empty.textContent = 'Каталог порожній';
        content.appendChild(empty);
    }

    function renderCatalog(catalog) {
        const assets = catalog && Array.isArray(catalog.assets) ? catalog.assets : [];
        const content = document.getElementById('catalogContent');
        content.innerHTML = '';

        if (!assets.length) {
            renderNoAssets();
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'catalog-grid';

        assets.forEach(function(asset) {
            const card = document.createElement('article');
            card.className = 'asset-card';
            card.dataset.assetId = asset.assetId || '';

            const poster = document.createElement('img');
            poster.className = 'asset-poster';
            poster.src = choosePosterUrl(asset);
            poster.alt = asset.name || 'Asset poster';
            poster.onerror = function() {
                poster.onerror = null;
                poster.src = FALLBACK_POSTER;
            };

            const info = document.createElement('div');
            info.className = 'asset-info';

            const title = document.createElement('h3');
            title.className = 'asset-name';
            title.textContent = asset.name || 'Asset Name';
            title.title = asset.name || 'Asset Name';

            const meta = document.createElement('div');
            meta.className = 'asset-meta';

            const type = document.createElement('span');
            type.className = 'asset-type';
            type.textContent = asset.assetType || 'Відео';

            const year = document.createElement('span');
            year.className = 'asset-year';
            year.textContent = asset.releaseDate || 'N/A';

            meta.appendChild(type);
            meta.appendChild(year);
            info.appendChild(title);
            info.appendChild(meta);
            card.appendChild(poster);
            card.appendChild(info);
            grid.appendChild(card);
        });

        content.appendChild(grid);
    }

    async function loadCatalog() {
        renderLoading();

        try {
            const response = await authFetch(CATALOG_URL);

            if (response.redirected) {
                redirectToLogin(response.url);
                return;
            }

            if (response.status === 401) {
                redirectToLogin();
                return;
            }

            if (!response.ok) {
                renderError('Error: catalog request failed with status ' + response.status);
                return;
            }

            renderCatalog(await response.json());
        } catch (error) {
            renderError('Error: ' + error.message);
        }
    }

    function setupUserProfileDropdown() {
        const userProfileBtn = document.getElementById('userProfileBtn');
        const userProfileDropdown = document.getElementById('userProfileDropdown');
        const logoutBtn = document.getElementById('logoutBtn');

        userProfileBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            userProfileDropdown.classList.toggle('show');
        });

        document.addEventListener('click', function(event) {
            if (!userProfileDropdown.contains(event.target) && !userProfileBtn.contains(event.target)) {
                userProfileDropdown.classList.remove('show');
            }
        });

        userProfileDropdown.addEventListener('click', function(event) {
            if (event.target !== logoutBtn) {
                userProfileDropdown.classList.remove('show');
            }
        });

        logoutBtn.addEventListener('click', function() {
            fetch(LOGOUT_URL, {
                method: 'POST',
                credentials: 'include'
            }).finally(function() {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = LOGIN_URL + '?logout';
            });
        });
    }

    window.addEventListener('load', function() {
        setupUserProfileDropdown();
        loadUserProfile().catch(function() {});
        loadCatalog();
    });
</script>
</body>
</html>
